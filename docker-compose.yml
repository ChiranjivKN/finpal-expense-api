services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finpal-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_PASSWORD}"
    
    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"Select 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./FinPal.Expense.Api
      dockerfile: Dockerfile

    container_name: finpal-api

    ports:
      - "8080:8080"
      - "8081:8081"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FinPalDB;User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data: 

    