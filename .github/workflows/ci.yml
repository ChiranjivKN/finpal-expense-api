name: FinPal CI

on: 
  push: 
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout/@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Restore dependencies
        run: dotnet restore FinPal.sln

      - name: Build
        run: dotnet build FinPal.sln --no restore --configuration Release

      - name: Run tests
        run: dotnet test FinPal.sln -- no build --configuration Release